[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-meter-data-analytics"
version = "1.0.0"
description = "Leakage-aware smart-meter segmentation, anomaly detection, and probabilistic forecasting"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Junaid Hossain" }]
keywords = [
  "smart-grid",
  "smart-meter",
  "load-forecasting",
  "anomaly-detection",
  "energy-analytics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "notebook>=7,<8"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
smart-meter-generate = "generate_smart_meter_data:main"
smart-meter-analyze = "train_models:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["generate_smart_meter_data", "train_models"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
